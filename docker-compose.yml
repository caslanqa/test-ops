# Installation file: runs with the prebuilt image from GHCR, no source code needed (see README.md).
# Inside the repo, `docker compose` commands also load docker-compose.override.yml
# automatically; that file builds the image from source and exposes Postgres to the host (development).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testops}
      POSTGRES_DB: ${POSTGRES_DB:-testops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # The port is deliberately not exposed to the host: the app connects over the compose
    # network, and there is no 5432 conflict with another Postgres on the host.

  # Single image: the API + web UI are served from the same container on a single port.
  app:
    # To pin a version, set e.g. APP_IMAGE=ghcr.io/caslanqa/testops:0.2.0 in .env
    image: ${APP_IMAGE:-ghcr.io/caslanqa/testops:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-testops}:${POSTGRES_PASSWORD:-testops}@postgres:5432/${POSTGRES_DB:-testops}?schema=public
      # No default: compose stops if it is empty; the app does not start with the example/a short value.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set; add it to .env (scripts/start.sh generates one)}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Self-registration ("Create one" link on the login screen); if false, only workspace admins create accounts.
      SELF_REGISTRATION: ${SELF_REGISTRATION:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-}
      AUTH_IP_RATE_LIMIT_PER_MINUTE: ${AUTH_IP_RATE_LIMIT_PER_MINUTE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # FR-074: largest JSON request body in bytes (e.g. a bulk result upload); if left empty, 10 MiB
      JSON_MAX_REQUEST_SIZE_BYTES: ${JSON_MAX_REQUEST_SIZE_BYTES:-}
      ATTACHMENTS_DIR: /data/attachments
      # FR-045: if left empty, the app defaults are used (32 MB / 128 MB / 20 files)
      ATTACHMENT_MAX_FILE_SIZE_BYTES: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:-}
      ATTACHMENT_MAX_REQUEST_SIZE_BYTES: ${ATTACHMENT_MAX_REQUEST_SIZE_BYTES:-}
      ATTACHMENT_MAX_FILES_PER_REQUEST: ${ATTACHMENT_MAX_FILES_PER_REQUEST:-}
      ATTACHMENT_ALLOWED_EXTENSIONS: ${ATTACHMENT_ALLOWED_EXTENSIONS:-}
      PORT: "3000"
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Use any port you like on the host side: APP_PORT=9090 docker compose up
    ports:
      - "${APP_PORT:-8080}:3000"

volumes:
  pgdata:
  attachments:
