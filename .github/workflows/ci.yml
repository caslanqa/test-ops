name: CI

# Runs on every PR and when called from release.yml (workflow_call). There is no
# separate `push` trigger because release.yml already calls this workflow on master
# pushes; the image is only published if this workflow passes.
on:
  pull_request:
  workflow_call: {}

permissions:
  contents: read

jobs:
  verify:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # install.sh runs on users' machines via `curl | bash`; it and the image's entrypoint
      # must stay lint-clean. ShellCheck is preinstalled on GitHub's Ubuntu runners.
      - name: Lint shell scripts
        run: shellcheck install.sh scripts/*.sh tests/smoke/ensure-env.sh apps/api/docker-entrypoint.sh

      # The script that makes .env (JWT_SECRET, AI_ENCRYPTION_KEY) runs in a throwaway tree; no Docker needed.
      - name: Test the .env script
        run: bash tests/smoke/ensure-env.sh

      # The pnpm version is read from the `packageManager` field in package.json (same as the Dockerfile).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # The Node version is kept in sync with the base image in the Dockerfile.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @testops/api run prisma:generate

      - name: API typecheck
        run: pnpm --filter @testops/api exec tsc --noEmit

      - name: API build
        run: pnpm --filter @testops/api run build

      # API lint (eslint) is not installed/configured yet; see PLAN.md 0.1.
      - name: Web lint
        run: pnpm --filter @testops/web run lint

      - name: Web build (includes tsc -b)
        run: pnpm --filter @testops/web run build

      # The npm package includes the shared reporting client and Playwright adapter.
      - name: Build TestOps reporter package
        run: pnpm --filter @testops/reporter run build

      - name: Test TestOps reporter package
        run: pnpm --filter @testops/reporter run test

  smoke:
    name: Docker smoke tests
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The app does not start with a default/short JWT_SECRET; the script generates a random one.
      - name: Prepare .env
        run: bash scripts/ensure-env.sh

      # Same image as the Dockerfile that gets published; waits until the app healthcheck (/ready) passes.
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed demo data
        run: docker compose exec -T app node prisma/seed.js

      - name: Smoke tests
        run: |
          node tests/smoke/openapi.mjs
          node tests/smoke/scope.mjs
          node tests/smoke/api-crud.mjs
          node tests/smoke/users.mjs
          node tests/smoke/results.mjs
          node tests/smoke/webhooks.mjs
          bash tests/smoke/attachments.sh
          node tests/smoke/ratelimit.mjs

      # Recreating the app resets the in-memory sign-up limit that the suites above have used up.
      - name: Role ladder smoke test
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 120 app
          node tests/smoke/roles.mjs

      # Every user's own DEMO workspace, then DEMO_WORKSPACE=false: no new ones, existing ones stay.
      # Recreating the app resets the in-memory sign-up limit that the suites above have used up.
      - name: Demo workspaces, and switched off
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 120 app
          node tests/smoke/demo-workspace.mjs
          DEMO_WORKSPACE=false docker compose up -d --wait --wait-timeout 120 app
          node tests/smoke/demo-workspace.mjs --disabled

      # Real webhook calls, to a receiver inside the app container, so private addresses are allowed.
      - name: Webhook delivery smoke test
        run: |
          WEBHOOK_ALLOW_PRIVATE_NETWORKS=true docker compose up -d --wait --wait-timeout 120 app
          node tests/smoke/webhooks.mjs --deliver

      # Recreates only the app container with sign-up disabled; the database and seed data stay.
      - name: Closed installation smoke test
        run: |
          SELF_REGISTRATION=false docker compose up -d --wait --wait-timeout 120 app
          node tests/smoke/closed-install.mjs

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color app postgres
