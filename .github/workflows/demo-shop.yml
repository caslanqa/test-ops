name: Demo shop

# Keeps the example in examples/demo-shop working: typechecks it and runs its Playwright tests
# against the example shop. On pushes and pull requests the reporter has no settings, so the
# results stay in the job.
#
# It is also an example of CI started by TestOps: a project's CI webhook (Integrations) pointed at
# this repository's dispatches endpoint sends "testops.run.started". The job then runs only the
# run's automated cases by their TestOps IDs and reports into that run. Result reporting uses an
# Automation token; metadata sync uses a Tester/Admin token.
on:
  repository_dispatch:
    types: [testops.run.started]
  push:
    branches: [master]
    paths:
      - "examples/demo-shop/**"
      - "packages/reporter/**"
      - ".github/workflows/demo-shop.yml"
  pull_request:
    paths:
      - "examples/demo-shop/**"
      - "packages/reporter/**"
      - ".github/workflows/demo-shop.yml"
  workflow_dispatch: {}

concurrency:
  group: demo-shop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    # shop-e2e.yml serves the project named by SHOP_E2E_PROJECT_ID; the server sends the same event for every project.
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.project.id != vars.SHOP_E2E_PROJECT_ID
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo-shop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/demo-shop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The personal demo project has fresh case UUIDs; map its fixture refs to those IDs from the
      # webhook payload. The Playwright reporter and sync command receive the actual TestOps IDs.
      - name: Map demo cases to TestOps IDs
        if: github.event_name == 'repository_dispatch'
        run: |
          jq -r '.client_payload.automated_cases[]? as $case | ($case.tags // [])[]? | select(startswith("demo-ref:")) | [$case.test_case_id, .[9:]] | @tsv' "$GITHUB_EVENT_PATH" |
          while IFS=$'\t' read -r case_id ref; do
            name=$(printf '%s' "$ref" | tr '[:lower:]' '[:upper:]' | tr '-.' '__')
            printf 'TESTOPS_CASE_%s=%s\n' "$name" "$case_id" >> "$GITHUB_ENV"
          done

      # Only the cases the run wants: the reporter tags each test with its TestOps case ID.
      - name: Choose the tests TestOps asked for
        id: pick
        if: github.event_name == 'repository_dispatch'
        run: |
          ids=$(jq -r '[.client_payload.automation_case_ids // [] | .[] | select(test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"))] | join("|")' "$GITHUB_EVENT_PATH")
          if [ -n "$ids" ]; then
            echo "grep=@testops-($ids)(\\s|\$)" >> "$GITHUB_OUTPUT"
          else
            echo 'grep=(?!)' >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Playwright test metadata to TestOps
        if: github.event_name == 'repository_dispatch'
        env:
          TESTOPS_URL: ${{ github.event.client_payload.api_url }}
          TESTOPS_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          TESTOPS_SYNC_TOKEN: ${{ secrets.TESTOPS_SYNC_TOKEN }}
        run: npx testops-sync --apply

      - name: Run the tests
        env:
          GREP: ${{ steps.pick.outputs.grep }}
          # Set only when TestOps started the job; the reporter then writes into that run.
          TESTOPS_URL: ${{ github.event.client_payload.api_url }}
          TESTOPS_PROJECT_ID: ${{ github.event.client_payload.project.id }}
          TESTOPS_RUN_ID: ${{ github.event.client_payload.run.id }}
          TESTOPS_TOKEN: ${{ github.event_name == 'repository_dispatch' && secrets.TESTOPS_TOKEN || '' }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --grep "$GREP"
          else
            npx playwright test
          fi

      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: examples/demo-shop/playwright-report
          retention-days: 14
