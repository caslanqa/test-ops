name: Demo shop

# Keeps the example in examples/demo-shop working: typechecks it and runs its Playwright tests
# against the example shop. The TestOps reporter has no settings here, so the results stay in the
# job; the DEMO workspace that every TestOps server shows is built by the server itself.
on:
  push:
    branches: [master]
    paths:
      - "examples/demo-shop/**"
      - ".github/workflows/demo-shop.yml"
  pull_request:
    paths:
      - "examples/demo-shop/**"
      - ".github/workflows/demo-shop.yml"
  workflow_dispatch: {}

concurrency:
  group: demo-shop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo-shop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/demo-shop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npx playwright test

      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: examples/demo-shop/playwright-report
          retention-days: 14
