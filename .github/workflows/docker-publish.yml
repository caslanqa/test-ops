name: Publish Docker image

# Yalnızca release.yml'den çağrılır; sürümü o hesaplar (bkz. scripts/next-version.sh).
on:
  workflow_call:
    inputs:
      version:
        description: Yayınlanacak semver, "v" öneki olmadan (ör. 0.1.3)
        required: true
        type: string

jobs:
  build-and-push:
    name: Build and push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/testops
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # amd64 runner üzerinde linux/arm64 imajını emülasyonla derlemek için
      # (Apple Silicon ve ARM sunucularda imaj native çalışsın diye).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Multi-arch imajlarda GHCR açıklama/kaynak bilgisini index'ten okur.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # Sürüm git ref'inden değil input'tan gelir; `latest` prerelease olmayan
          # semver'de flavor latest=auto ile eklenir.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GITHUB_TOKEN ile yayınlanan paket repo'nun görünürlüğünü devralır (public repo →
      # public paket). Self-hosted kullanıcılar auth'suz çekebilsin diye anonim olarak doğrulanır.
      - name: Verify anonymous pull
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker logout ghcr.io
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null; then
            echo "Anonim çekilebiliyor: $IMAGE:$VERSION"
          else
            echo "::warning::$IMAGE:$VERSION anonim çekilemiyor; GitHub'da paket görünürlüğünü Public yapın."
          fi
