name: Publish Docker image

# Only called from release.yml, which computes the version (see scripts/next-version.sh).
on:
  workflow_call:
    inputs:
      version:
        description: Semver to publish, without the "v" prefix (e.g. 0.1.3)
        required: true
        type: string

jobs:
  build-and-push:
    name: Build and push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/testops
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # To build the linux/arm64 image via emulation on the amd64 runner
      # (so the image runs natively on Apple Silicon and ARM servers).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        env:
          # For multi-arch images GHCR reads the description/source info from the index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # The version comes from the input, not the git ref; `latest` is added for
          # non-prerelease semver via flavor latest=auto.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A package published with GITHUB_TOKEN inherits the repo's visibility (public repo →
      # public package). Verified anonymously so self-hosted users can pull without auth.
      - name: Verify anonymous pull
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker logout ghcr.io
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null; then
            echo "Anonymous pull works: $IMAGE:$VERSION"
          else
            echo "::warning::$IMAGE:$VERSION cannot be pulled anonymously; set the package visibility to Public on GitHub."
          fi
