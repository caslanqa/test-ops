name: Release

# On every push/merge to master (except Markdown-only changes), with no manual
# steps: CI → compute version → publish the image to GHCR → tag + GitHub Release.
# See scripts/next-version.sh for the versioning rules.
#
# Because the tag is created with GITHUB_TOKEN, GitHub does not trigger another workflow;
# that is why publishing happens inside this run instead of a separate tag-triggered workflow.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

# Runs are serialized so two back-to-back pushes do not compute the same version and collide.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Compute version
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - name: Checkout (tags + history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        run: bash scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

  publish:
    name: Publish image
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      packages: write

  release:
    name: Tag and GitHub Release
    # The tag and release are created only after the image has been published successfully.
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/testops:${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Docker image: \`$IMAGE\` (linux/amd64, linux/arm64)" \
            --generate-notes
